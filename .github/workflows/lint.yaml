name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

-  name: Start Hardhat node
  run: yarn workspace @se-2/hardhat hardhat node > /tmp/hh.log 2>&1 &

- name: Wait for node
  run: sleep 2

- name: Compile
  run: yarn workspace @se-2/hardhat hardhat compile

- name: Deploy (direct script)
  run: yarn workspace @se-2/hardhat node scripts/deploySoulboundDirect.mjs
  env:
    RPC_URL: http://127.0.0.1:8545
    __RUNTIME_DEPLOYER_PRIVATE_KEY: 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

-  name: Compile contracts
  run: yarn workspace @se-2/hardhat hardhat compile

- name: Deploy contracts (direct script)
  run: |
    RPC_URL=http://127.0.0.1:8545 \
    __RUNTIME_DEPLOYER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
    yarn workspace @se-2/hardhat node scripts/deploySoulboundDirect.mjs

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types

      - name: Run hardhat lint
        run: yarn hardhat:lint --max-warnings=0
